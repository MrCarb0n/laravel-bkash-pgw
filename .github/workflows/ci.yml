name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} / L${{ matrix.laravel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '7.4', laravel: 6.* }
          - { php: '7.4', laravel: 8.* }
          - { php: '8.0', laravel: 8.* }
          - { php: '8.1', laravel: 9.* }
          - { php: '8.2', laravel: 10.* }
          - { php: '8.3', laravel: 11.* }
          - { php: '8.3', laravel: 12.* }

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, openssl, mbstring
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --prefer-stable

      - name: Tests
        run: vendor/bin/phpunit

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, openssl, mbstring
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --prefer-stable

      - name: Syntax check
        run: find src -name "*.php" -exec php -l {} \; > /dev/null

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress